name: Apply Bing SEO metadata fix

on:
  push:
    branches:
      - audit/bing-seo-meta-fix-20260803
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GAME_CATALOG_MODE: local
      CACHE_MODE: local
      NEXT_PUBLIC_DISABLE_ANALYTICS: '1'
      NEXT_PUBLIC_AUTOMATED_TEST: '1'
      NODE_ENV: test

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/bing-seo-meta-fix-20260803
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Apply deterministic source patch
        run: python3 scripts/apply-bing-seo-fix.py

      - name: Include out-of-tree unit regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vitest.config.mts')
          text = path.read_text(encoding='utf-8')
          old = "include: ['tests/**/*.test.ts'],"
          new = "include: ['tests/**/*.test.ts', 'lib/**/*.test.ts'],"
          if old not in text:
              raise SystemExit('Expected Vitest include pattern was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Internal link audit
        run: pnpm check:internal-links

      - name: Unit tests
        run: pnpm test -- --run

      - name: Confirm validation regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/utils/validation.test.ts
          grep -Fq "lib/**/*.test.ts" vitest.config.mts
          echo "lib/utils/validation.test.ts is included in the successful default unit suite."

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Install Chromium for browser validation
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        env:
          NODE_ENV: test
        run: pnpm test:e2e

      - name: Local production smoke test
        env:
          NODE_ENV: production
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/luma-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/en >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/luma-server.log
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/luma-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/games/drive-mad | grep -q '<meta name="description"'
          curl --fail --silent http://127.0.0.1:3000/en/games/category/puzzle | grep -q '<meta name="description"'
          curl --fail --silent http://127.0.0.1:3000/guides/game-opportunity-radar | grep -q '<meta name="description"'
          curl --fail --silent http://127.0.0.1:3000/sitemap.xml | grep -q 'game-opportunity-radar'

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes produced by the deterministic patch."
            exit 1
          fi
          git commit -m "fix(seo): expand contextual meta descriptions"
          git push origin HEAD:audit/bing-seo-meta-fix-20260803
