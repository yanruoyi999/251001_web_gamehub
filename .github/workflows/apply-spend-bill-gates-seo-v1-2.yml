name: Apply Spend Bill Gates Money SEO v1.2

on:
  push:
    branches:
      - feat/spend-bill-gates-money-seo-v1-2-20260804
    paths:
      - scripts/apply-spend-bill-gates-seo-v1-2.py
      - .github/workflows/apply-spend-bill-gates-seo-v1-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spend-bill-gates-money-seo-v1-2-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Apply deterministic repository patch
        run: python scripts/apply-spend-bill-gates-seo-v1-2.py
      - name: Remove one-time patch tools
        run: |
          rm scripts/apply-spend-bill-gates-seo-v1-2.py
          rm .github/workflows/apply-spend-bill-gates-seo-v1-2.yml
      - name: Commit generated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expand billionaire game SEO and discovery'
          git push origin HEAD:feat/spend-bill-gates-money-seo-v1-2-20260804

