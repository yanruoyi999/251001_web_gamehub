name: Audit workspace export
on:
  push:
    branches: [fix/luma-audit-20260905]
    paths: [.github/workflows/audit-workspace-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'yanruoyi999/251001_web_gamehub'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAME_CATALOG_MODE: local
      CACHE_MODE: local
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Verify unmodified baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-export"
          pnpm install --frozen-lockfile
          pnpm exec vitest run 2>&1 | tee "$RUNNER_TEMP/audit-export/baseline-unit.log"
      - name: Resolve security patch dependencies
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.next = '15.5.25';
          p.devDependencies['eslint-config-next'] = '15.5.25';
          p.pnpm.overrides.sharp = '0.35.4';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
          cp package.json pnpm-lock.yaml "$RUNNER_TEMP/audit-export/"
          pnpm audit --prod --json > "$RUNNER_TEMP/audit-export/dependency-audit.json"
          node - <<'NODE' > "$RUNNER_TEMP/audit-export/runtime-versions.json"
          const { createRequire } = require('node:module');
          const r = createRequire(require.resolve('next/package.json'));
          console.log(JSON.stringify({ node: process.version, next: require('next/package.json').version, sharp: r('sharp').versions }, null, 2));
          NODE
          git bundle create "$RUNNER_TEMP/audit-export/luma-source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/audit-export/commit.txt"
          cd "$RUNNER_TEMP/audit-export"
          sha256sum luma-source.bundle package.json pnpm-lock.yaml > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: luma-audit-security-resolution
          path: ${{ runner.temp }}/audit-export/
          retention-days: 1
          if-no-files-found: error
      - name: Pack offline verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-tools"
          npm pack pnpm@10.28.0 --pack-destination "$RUNNER_TEMP/audit-tools" > /dev/null
          tar -czf "$RUNNER_TEMP/audit-tools/node_modules.tar.gz" node_modules
          pnpm exec playwright install chromium
          tar -czf "$RUNNER_TEMP/audit-tools/chromium.tar.gz" -C "$HOME/.cache" ms-playwright
          cd "$RUNNER_TEMP/audit-tools"
          sha256sum *.tgz *.tar.gz > SHA256SUMS
          split -b 200M node_modules.tar.gz modules.part-
          split -b 200M chromium.tar.gz browser.part-
          ls -lh *.part-*
      - uses: actions/upload-artifact@v4
        with:
          name: luma-audit-tools-part-aa
          path: |
            ${{ runner.temp }}/audit-tools/*.part-aa
            ${{ runner.temp }}/audit-tools/*.tgz
            ${{ runner.temp }}/audit-tools/SHA256SUMS
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: luma-audit-tools-part-ab
          path: ${{ runner.temp }}/audit-tools/*.part-ab
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: luma-audit-tools-part-ac
          path: ${{ runner.temp }}/audit-tools/*.part-ac
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
