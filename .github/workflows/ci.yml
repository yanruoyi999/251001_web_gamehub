name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Internal link audit
        id: internal_links
        shell: bash
        run: |
          set -o pipefail
          pnpm check:internal-links 2>&1 | tee internal-link-output.txt

      - name: Upload internal link diagnostics
        if: failure() && steps.internal_links.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-diagnostics
          if-no-files-found: error
          retention-days: 3
          path: internal-link-output.txt

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test -- --run 2>&1 | tee test-output.txt
        env:
          NODE_ENV: test

      - name: Upload unit test diagnostics
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          if-no-files-found: error
          retention-days: 3
          path: test-output.txt

      - name: Audit production dependencies
        id: dependency_audit
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:prod 2>&1 | tee dependency-audit-output.txt

      - name: Upload dependency audit diagnostics
        if: failure() && steps.dependency_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-diagnostics
          if-no-files-found: error
          retention-days: 7
          path: dependency-audit-output.txt

      - name: Production build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        id: e2e_tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e-output.txt

      - name: Upload end-to-end diagnostics
        if: failure() && steps.e2e_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            e2e-output.txt
            playwright-report
            test-results

      - name: Start local production server
        run: |
          GAME_CATALOG_MODE=local CACHE_MODE=local pnpm start -p 3217 > next-start.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3217/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: Runtime quality gate
        id: runtime_quality
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:runtime-quality -- --base-url http://localhost:3217 --write /tmp/page-runtime-sampling.md 2>&1 | tee runtime-quality-output.txt

      - name: Upload runtime diagnostics
        if: failure() && steps.runtime_quality.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-quality-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            runtime-quality-output.txt
            next-start.log
            /tmp/page-runtime-sampling.md
