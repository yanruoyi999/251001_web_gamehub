name: One-shot Google Snake SEO update

on:
  push:
    branches:
      - fix/google-snake-mods-seo-title-optimization-20260808

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-snake-mods-seo-title-optimization-20260808
          fetch-depth: 0

      - name: Apply exact SEO replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/seo-landing-content.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "Google Snake Mods: Mod Menu, Loader & Mobile Guide",
                  "Google Snake Mods: Mod Menu, More Menu, Mods 2 & Loader",
              ),
              (
                  "Looking for Google Snake Mods 2, a mod menu, or the Snake Mod Loader? Compare the maintained web version, userscript route, mobile limits, and safe fallback.",
                  "Google Snake Mods 2 guide to Mod Menu, More Menu, Snake Mod Loader and Level Editor. Compare web and userscript routes, mobile limits, and safe setup.",
              ),
              (
                  "Google Snake Mods: Mod Menu, Loader and Mobile Options",
                  "Google Snake Mods: Mod Menu, More Menu, Loader & Mods 2",
              ),
              (
                  "Quick Answer: Mod Menu or Snake Mod Loader?",
                  "Google Snake Mods 2: Mod Menu, More Menu or Loader?",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-google-snake-seo-20260808.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/seo-landing-content.ts .github/workflows/one-shot-google-snake-seo-20260808.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: align Google Snake Mods SERP intent"
          git push origin HEAD:fix/google-snake-mods-seo-title-optimization-20260808
