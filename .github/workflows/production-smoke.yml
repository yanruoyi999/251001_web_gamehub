name: Production interaction smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-player-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run telemetry-isolated production smoke
        env:
          PLAYWRIGHT_BASE_URL: https://www.lumagamehub.com
        run: pnpm test:e2e:production-smoke
